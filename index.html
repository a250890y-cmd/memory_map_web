<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Map App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Left Sidebar for Albums & Filters -->
    <aside class="sidebar glass-panel">
      <div class="sidebar-header">
        <h2>Memory Map</h2>
        <p>あなたの思い出</p>
      </div>
      
      <div class="sidebar-filters">
        <input type="text" id="search-input" placeholder="思い出を検索..." class="filter-input" />
        
        <div class="date-filter">
          <label>期間絞り込み</label>
          <input type="date" id="filter-date-from" class="filter-input small" />
          <div style="text-align:center; color:var(--text-muted); font-size: 0.8rem; margin:2px 0;">〜</div>
          <input type="date" id="filter-date-to" class="filter-input small" />
        </div>
      </div>

      <div class="sidebar-content">
        <h3>Albums</h3>
        <ul id="sidebar-album-list" class="album-list">
          <li class="active" data-album="">すべて表示</li>
        </ul>
      </div>
    </aside>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Map Controls (Top Right) -->
    <div class="map-controls glass-panel">
      <select id="map-style-select" class="map-style-select">
        <option value="standard">標準地図</option>
        <option value="satellite">衛星写真</option>
        <option value="dark">ダークモード</option>
      </select>
    </div>

    <!-- Bottom Right Controls -->
    <div class="bottom-controls">
      <button id="btn-current-location" class="control-btn glass-panel" title="現在地へ移動">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </button>
      <button id="btn-pin-current" class="control-btn primary-btn" title="現在地にピンを作成">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span style="margin-left: 6px; font-weight: 600; font-size: 0.95rem;">ここで記録</span>
      </button>
    </div>

    <!-- Memory Input Modal -->
    <div id="memory-modal" class="modal-overlay hidden">
      <div class="modal-content glass-panel scrollable">
        <h2 id="modal-title">思い出を記録</h2>
        <input type="hidden" id="memory-id" value="" />
        
        <div class="preview-gallery" id="btn-select-photo">
          <div id="preview-images-container" class="preview-images-container hidden"></div>
          <div id="preview-placeholder" class="placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>タップして写真を選択（複数可）</p>
          </div>
        </div>

        <div class="input-group">
          <label for="memory-datetime">日時</label>
          <input type="datetime-local" id="memory-datetime" />
        </div>

        <div class="input-group row">
          <div class="flex-1">
            <label for="memory-category">カテゴリ</label>
            <select id="memory-category">
              <option value="camera">📷 写真</option>
              <option value="food">🍽️ 食事</option>
              <option value="cafe">☕ カフェ</option>
              <option value="sightseeing">🗼 観光</option>
              <option value="nature">⛰️ 景色</option>
              <option value="hotel">🏨 宿泊</option>
              <option value="shopping">🛍️ 買い物</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="memory-album">アルバム名</label>
            <input type="text" id="memory-album" placeholder="例: 2024年 夏休み" list="album-datalist" />
            <datalist id="album-datalist"></datalist>
          </div>
        </div>

        <div class="input-group">
          <label for="memory-title">タイトル</label>
          <input type="text" id="memory-title" placeholder="素敵な場所" />
        </div>
        <div class="input-group">
          <label for="memory-diary">日記</label>
          <textarea id="memory-diary" rows="3" placeholder="どんな思い出ですか？"></textarea>
        </div>
        <div class="modal-actions">
          <button id="btn-save-memory" class="btn primary">保存</button>
          <button class="btn-close">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="modal-overlay hidden" style="z-index: 9999;">
      <div class="spinner"></div>
      <p id="loading-text" style="color: white; margin-top: 1rem; font-weight: 500;">処理中...</p>
    </div>

    <!-- Hidden file input for local photo(s) -->
    <input type="file" id="file-input" accept="image/*" multiple class="hidden" />

    <script type="module" src="/main.js"></script>
  </body>
</html>
