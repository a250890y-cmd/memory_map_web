<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Memory Map App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Hamburger Button (Mobile Only) -->
    <button id="btn-hamburger" class="btn-hamburger glass-panel">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <!-- Left Sidebar for Albums & Filters -->
    <aside class="sidebar glass-panel" style="display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div class="sidebar-header">
          <h2>Memory Map</h2>
          <p>あなたの思い出</p>
        </div>
        
        <div class="sidebar-filters">
          <input type="text" id="search-input" placeholder="思い出を検索..." class="filter-input" />
          
          <div class="date-filter">
            <label>期間絞り込み</label>
            <input type="date" id="filter-date-from" class="filter-input small" />
            <div style="text-align:center; color:var(--text-muted); font-size: 0.8rem; margin:2px 0;">〜</div>
            <input type="date" id="filter-date-to" class="filter-input small" />
          </div>
        </div>

        <div class="sidebar-content">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin-bottom: 0;">Albums</h3>
            <button id="btn-play-tour" class="btn" style="padding: 4px 8px; font-size: 0.75rem; background: rgba(59,130,246,0.1); color: var(--primary-color);">▶ ツアー再生</button>
          </div>
          <ul id="sidebar-album-list" class="album-list">
            <li class="active" data-album="">すべて表示</li>
          </ul>

          <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Tags</h3>
          <ul id="sidebar-tag-list" class="album-list">
            <li class="active" data-tag="">すべて表示</li>
          </ul>
        </div>
      </div>
      
      <div style="margin-top: 1rem; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1rem;">
        <button id="btn-logout" class="btn" style="width: 100%; padding: 8px; font-size: 0.85rem; background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid rgba(239,68,68,0.2);">ログアウト</button>
      </div>
    </aside>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Map Controls (Top Right) -->
    <div class="map-controls glass-panel">
      <select id="map-style-select" class="map-style-select">
        <option value="standard">標準地図</option>
        <option value="satellite">衛星写真</option>
        <option value="dark">ダークモード</option>
      </select>
    </div>

    <!-- Bottom Right Controls -->
    <div class="bottom-controls">
      <button id="btn-current-location" class="control-btn glass-panel" title="現在地へ移動">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </button>
    </div>
    
    <!-- Center Bottom Control -->
    <div class="center-bottom-control">
      <button id="btn-pin-current" class="control-btn primary-btn" title="現在地にピンを作成">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span style="margin-left: 8px; font-weight: 700; font-size: 1.1rem;">ここで記録</span>
      </button>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
      <div class="modal-content glass-panel" style="text-align: center;">
        <h2 style="margin-bottom: 0.5rem; color: var(--primary-color);">Memory Mapへようこそ</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">クラウド同期を有効にするためにログインしてください</p>
        
        <div class="input-group">
          <input type="email" id="login-email" placeholder="メールアドレス" />
        </div>
        <div class="input-group">
          <input type="password" id="login-password" placeholder="パスワード" />
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button id="btn-login" class="btn primary">ログイン</button>
          <button id="btn-signup" class="btn" style="background: rgba(0,0,0,0.05); color: var(--text-main);">新規登録</button>
        </div>
        
        <p id="login-error" style="color: var(--error); font-size: 0.85rem; margin-top: 1rem; display: none;"></p>
      </div>
    </div>

    <!-- Memory Input Modal -->
    <div id="memory-modal" class="modal-overlay hidden">
      <div class="modal-content glass-panel scrollable">
        <h2 id="modal-title">思い出を記録</h2>
        <input type="hidden" id="memory-id" value="" />
        
        <div class="preview-gallery" id="btn-select-photo" style="position: relative; margin-bottom: 0.5rem;">
          <div id="preview-images-container" class="preview-images-container hidden"></div>
          <div id="preview-placeholder" class="placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>タップして写真を選択（複数可）</p>
          </div>
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
          <button id="btn-add-more-photos" type="button" class="btn hidden" style="display: inline-flex; width: auto; padding: 6px 12px; font-size: 0.8rem; background: rgba(59,130,246,0.1); color: var(--primary-color);">+ 写真を追加</button>
        </div>

        <div class="input-group">
          <label for="memory-datetime">日時</label>
          <input type="datetime-local" id="memory-datetime" />
        </div>

        <div class="input-group row">
          <div class="flex-1">
            <label>タグ</label>
            <div id="tags-container" class="tags-container">
              <!-- Tags will be rendered here -->
              <input type="text" id="memory-tag-input" placeholder="例: 景色, ヨルシカ" list="tag-datalist" autocomplete="off" />
            </div>
            <datalist id="tag-datalist"></datalist>
          </div>
          <div class="flex-1">
            <label for="memory-album">アルバム名</label>
            <input type="text" id="memory-album" placeholder="例: 2024年 夏休み" list="album-datalist" />
            <datalist id="album-datalist"></datalist>
          </div>
        </div>

        <div class="input-group">
          <label for="memory-title">タイトル</label>
          <input type="text" id="memory-title" placeholder="素敵な場所" />
        </div>
        <div class="input-group">
          <label for="memory-diary">日記</label>
          <textarea id="memory-diary" rows="3" placeholder="どんな思い出ですか？"></textarea>
        </div>
        
        <div style="display: flex; justify-content: center; margin-top: 0.5rem; margin-bottom: -0.5rem;">
          <button id="btn-delete-memory" class="btn hidden" style="background: rgba(239,68,68,0.1); color: var(--error); font-size: 0.85rem; padding: 6px 16px;">この思い出を削除する</button>
        </div>

        <div class="modal-actions" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button id="btn-save-memory" class="btn primary" style="flex: 1;">保存</button>
          <button class="btn-close" style="flex: 1; background: rgba(0,0,0,0.05); color: var(--text-main); margin-top: 0;">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="fullscreen-image-modal" class="modal-overlay hidden" style="z-index: 3000; background: rgba(0,0,0,0.9);">
      <button id="btn-close-fullscreen" style="position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; cursor: pointer;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <img id="fullscreen-image" src="" style="max-width: 90vw; max-height: 90vh; object-fit: contain;" />
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="modal-overlay hidden" style="z-index: 9999;">
      <div class="spinner"></div>
      <p id="loading-text" style="color: white; margin-top: 1rem; font-weight: 500;">処理中...</p>
    </div>

    <!-- Hidden file input for local photo(s) -->
    <input type="file" id="file-input" accept="image/*" multiple class="hidden" />

    <script type="module" src="/main.js"></script>
  </body>
</html>
